  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F18CW8305E"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    // Consent Mode v2 — must be set before the first 'config' call. Reads
    // any prior choice synchronously from localStorage so a returning
    // visitor's consent is honored immediately (no denied-then-granted
    // flash); a first-time visitor defaults to fully denied until
    // CookieConsentBanner.tsx captures a real choice and calls
    // gtag('consent','update',...). This is what lets AdSense fall back
    // to non-personalized ads for EEA/UK visitors who haven't consented,
    // without needing a separate TCF-certified CMP for that case —
    // personalized ads to EEA/UK still require one; see CMS_FIX_PLAN.md-
    // style notes in CookieConsentBanner.tsx for the parts that need the
    // site owner's own AdSense dashboard access.
    (function () {
      var stored = null;
      try { stored = JSON.parse(localStorage.getItem('bw_cookie_consent')); } catch (e) {}
      var ads = stored && stored.ads ? 'granted' : 'denied';
      var analytics = stored && stored.analytics ? 'granted' : 'denied';
      gtag('consent', 'default', {
        ad_storage: ads,
        ad_user_data: ads,
        ad_personalization: ads,
        analytics_storage: analytics,
        wait_for_update: 500,
      });
    })();

    gtag('js', new Date());

    gtag('config', 'G-F18CW8305E');
  </script>
